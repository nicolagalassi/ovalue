[build]
  publish = "dist"
  command = "npm run build"

# Redirect rules live here and not in public/_redirects: Cloudflare (wrangler.jsonc) reads a
# _redirects file in dist/ and refuses to deploy its external proxies. On Cloudflare the same
# behaviour comes from worker/index.js (/fusion) and not_found_handling (SPA).

# Exodus, the merged rankings of the 2026 merges: built and published by its own repo
# (nicolagalassi/ogame-exodus) on GitHub Pages every 3 hours, shown here under /fusion/ through a proxy, so
# its data refreshes never cost a Netlify build. Only the official public OGame API is read there.
# Netlify matches /fusion and /fusion/ alike, so a /fusion -> /fusion/ rule would redirect to itself: both are
# proxied, and the page itself adds the missing slash (its data paths are relative).
# These must stay above the catch-all of the Vue app.
[[redirects]]
  from = "/fusion"
  to = "https://nicolagalassi.github.io/ogame-exodus/"
  status = 200

[[redirects]]
  from = "/fusion/*"
  to = "https://nicolagalassi.github.io/ogame-exodus/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
